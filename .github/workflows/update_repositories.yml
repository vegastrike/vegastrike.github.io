name: Update Linux Repositories

on:
  workflow_dispatch:
  schedule:
    # Run once a week on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  update-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Linux Repositories
        run: |
          python3 scripts/generate_repositories.py --fetch --build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/repositories.json repositories/
          if git diff --staged --quiet; then
            echo "No changes in repositories metadata."
          else
            git commit -m "Automation: update Linux repositories metadata from GitHub Releases"
            git push
          fi
