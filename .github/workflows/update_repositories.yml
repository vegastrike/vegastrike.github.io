name: Update Linux Repositories

on:
  workflow_dispatch:
  schedule:
    # Run once a week on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  update-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Generate Linux Repositories
        run: |
          python3 scripts/generate_repositories.py --fetch --build

      - name: Commit and push changes
        env:
          TRIGGERED_BY: ${{ github.triggering_actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/repositories.json _data/checksums_cache.json repositories/
          if git diff --staged --quiet; then
            echo "No changes in repositories metadata."
          else
            git commit -m "Automation: update Linux repositories metadata from GitHub Releases" \
                       -m "Triggered by @${TRIGGERED_BY}"
            git push
          fi
